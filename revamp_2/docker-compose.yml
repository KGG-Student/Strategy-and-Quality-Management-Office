services:
  web:
    build: .
    container_name: sqmo_appV2
    ports:
      - "6000:6000"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: sqmo_mysqlV2
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 12345!
      MYSQL_DATABASE: sqmo
    ports:
      - "3307:3306"